<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f7f8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#07C160" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#07C160" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#0a0a0a" opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0a0a0a" flood-opacity="0.10"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a0a0a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07C160"/>
      <stop offset="1" stop-color="#06AD56"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="1010" cy="90" rx="420" ry="260" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#e5e5e5" stroke-width="2"/>

  <!-- 顶部品牌行：品牌 LOGO -->
  <g transform="translate(80, 62) scale(0.11)">
    <rect width="512" height="512" rx="113" fill="#07C160"/>
    <rect x="110" y="118" width="292" height="218" rx="56" fill="#ffffff"/>
    <g fill="none" stroke="#07C160" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M196 181 L166 227 L196 273"/>
      <path d="M222 273 L290 181"/>
      <path d="M316 181 L346 227 L316 273"/>
    </g>
    <path d="M384 330 L442 396 L384 462" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="156" y="97" font-size="17" font-weight="600" fill="#0a0a0a">AI 编程 · 零基础实战</text>
  <line x1="345" y1="90" x2="620" y2="90" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- 主标题 -->
  <text x="80" y="272" font-size="86" font-weight="800" fill="#0a0a0a" letter-spacing="-2">Vibe Coding</text>
  <text x="80" y="368" font-size="66" font-weight="800" fill="#0a0a0a" letter-spacing="0">微信小程序全流程指南</text>

  <!-- 副标题 -->
  <text x="80" y="428" font-size="26" fill="#525252">零基础 · 用 AI 从想法到上线</text>
  <text x="80" y="464" font-size="19" fill="#a3a3a3">需求 · 开发 · 部署 · 登录 · 支付 · 提审 · 迭代 · 维护</text>

  <!-- 标签 -->
  <g transform="translate(80, 510)">
    <rect x="0" y="0" width="140" height="44" rx="22" fill="#ffffff" stroke="#e5e5e5"/>
    <circle cx="24" cy="22" r="4" fill="#07C160"/>
    <text x="88" y="28" font-size="16" font-weight="500" fill="#404040" text-anchor="middle">12 章 + 2 附录</text>
    <rect x="156" y="0" width="132" height="44" rx="22" fill="#ffffff" stroke="#e5e5e5"/>
    <circle cx="180" cy="22" r="4" fill="#07C160"/>
    <text x="238" y="28" font-size="16" font-weight="500" fill="#404040" text-anchor="middle">约 3.4 万字</text>
    <rect x="304" y="0" width="132" height="44" rx="22" fill="#ffffff" stroke="#e5e5e5"/>
    <circle cx="328" cy="22" r="4" fill="#07C160"/>
    <text x="386" y="28" font-size="16" font-weight="500" fill="#404040" text-anchor="middle">零基础可读</text>
  </g>

  <!-- 底部信息 -->
  <text x="80" y="592" font-size="15" fill="#a3a3a3">github.com/guolios/vibe-coding-miniprogram-book · 更新于 2026-10 · CC BY 4.0</text>

  <!-- 右侧插画：小程序手机界面 -->
  <g transform="translate(0, 40)">
    <!-- 浮动聊天气泡（左上） -->
    <g filter="url(#softer)">
      <rect x="742" y="196" width="168" height="60" rx="18" fill="#ffffff" stroke="#e5e5e5"/>
      <circle cx="778" cy="226" r="6" fill="#0a0a0a"/>
      <circle cx="806" cy="226" r="6" fill="#a3a3a3"/>
      <circle cx="834" cy="226" r="6" fill="#d4d4d4"/>
      <path d="M790 256 L790 286 L818 256" fill="#ffffff" stroke="#e5e5e5"/>
    </g>
    <!-- 浮动小气泡（右下） -->
    <g filter="url(#softer)">
      <rect x="1068" y="470" width="118" height="48" rx="16" fill="#ffffff" stroke="#e5e5e5"/>
      <rect x="1090" y="488" width="66" height="12" rx="6" fill="#e5e5e5"/>
      <path d="M1096 518 L1096 542 L1120 518" fill="#ffffff" stroke="#e5e5e5"/>
    </g>
    <!-- 代码符号装饰 -->
    <text x="726" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" fill="#d4d4d4">&lt;/&gt;</text>
    <text x="1112" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#e5e5e5">{ }</text>

    <!-- 手机主体 -->
    <g filter="url(#soft)">
      <rect x="846" y="120" width="264" height="430" rx="40" fill="#0a0a0a"/>
      <rect x="858" y="132" width="240" height="406" rx="30" fill="#ffffff"/>
      <!-- 状态栏 -->
      <rect x="896" y="146" width="48" height="8" rx="4" fill="#e5e5e5"/>
      <circle cx="1000" cy="150" r="4" fill="#d4d4d4"/>
      <rect x="1012" y="146" width="20" height="8" rx="3" fill="#d4d4d4"/>
      <!-- 页面标题 -->
      <rect x="886" y="178" width="112" height="16" rx="8" fill="#0a0a0a" opacity="0.85"/>
      <rect x="886" y="206" width="72" height="10" rx="5" fill="#e5e5e5"/>
      <!-- 内容卡片 1 -->
      <rect x="886" y="238" width="184" height="66" rx="14" fill="#fafafa" stroke="#eeeeee"/>
      <circle cx="912" cy="268" r="10" fill="#07C160" opacity="0.15"/>
      <circle cx="912" cy="268" r="4" fill="#07C160"/>
      <rect x="932" y="256" width="106" height="10" rx="5" fill="#e5e5e5"/>
      <rect x="932" y="276" width="66" height="10" rx="5" fill="#f0f0f0"/>
      <!-- 内容卡片 2 -->
      <rect x="886" y="316" width="184" height="66" rx="14" fill="#fafafa" stroke="#eeeeee"/>
      <circle cx="912" cy="346" r="10" fill="#0a0a0a" opacity="0.08"/>
      <circle cx="912" cy="346" r="4" fill="#0a0a0a" opacity="0.4"/>
      <rect x="932" y="334" width="120" height="10" rx="5" fill="#e5e5e5"/>
      <rect x="932" y="354" width="80" height="10" rx="5" fill="#f0f0f0"/>
      <!-- 内容卡片 3（半透明） -->
      <rect x="886" y="394" width="184" height="66" rx="14" fill="#fafafa" stroke="#eeeeee"/>
      <circle cx="912" cy="424" r="10" fill="#0a0a0a" opacity="0.08"/>
      <circle cx="912" cy="424" r="4" fill="#0a0a0a" opacity="0.4"/>
      <rect x="932" y="412" width="94" height="10" rx="5" fill="#e5e5e5"/>
      <rect x="932" y="432" width="56" height="10" rx="5" fill="#f0f0f0"/>
      <!-- 主按钮 -->
      <rect x="886" y="486" width="184" height="38" rx="19" fill="url(#btn)"/>
      <text x="978" y="511" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">立即体验</text>
    </g>
  </g>
</svg>
